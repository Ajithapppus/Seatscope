<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a0a0c"><meta name="apple-mobile-web-app-title" content="SeatScope"><title>SeatScope – Pick your seat, see your view</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--s:#18181c;--s2:#24242a;--tx:#f3f3f5;--mu:#8b8b96;--gr:#5fd6a0;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{position:relative;width:min(430px,100%);height:min(100dvh,880px);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:500px){#app{border-radius:38px;border:1px solid #2b2b32;box-shadow:0 30px 90px #000,0 0 80px #3a3f7a22}}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
header div{text-align:center}header b{font-size:16px;font-weight:600;display:block}header small{color:var(--mu);font-size:12px}
.ghost{background:none;color:var(--mu);font-size:13px;width:52px;padding:6px 0}
.times{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
.pill{padding:8px 16px;border-radius:99px;background:var(--s);color:var(--mu);font-size:13px;font-weight:500;transition:.2s}.pill.on{background:#fff;color:#000}
.arc{height:38px;margin:14px 34px 0;border-top:2px solid #d5d8e6;border-radius:50% 50% 0 0/100% 100% 0 0;box-shadow:0 -14px 36px #aab4ff2e;position:relative}
.arc span{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:4px;color:var(--mu)}
#rows{flex:1;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:16px 10px;min-height:0}
.row{display:grid;grid-template-columns:14px repeat(6,1fr) 16px repeat(6,1fr);gap:5px;align-items:center;margin:auto}
.row b{font-size:9px;color:#55555f;font-weight:500}
.s{aspect-ratio:1;border-radius:6px 6px 4px 4px;background:#3b3b44;padding:0;transition:transform .15s,background .2s}
.s:hover{background:#5a5a66}.s.x{background:#17171b;cursor:not-allowed}.s.on{background:#fff;box-shadow:0 0 0 3px #ffffff33,0 0 18px #fff6}
.leg{display:flex;justify-content:center;gap:18px;font-size:11px;color:var(--mu);padding-bottom:8px}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0a0a0c00,#0a0a0c 30%)}
.bar small{color:var(--mu);font-size:11px;display:block}.bar b{font-size:15px;font-weight:600}
.go{background:var(--gr);color:#04140c;font-weight:600;padding:13px 30px;border-radius:99px;font-size:15px}.go:disabled{opacity:.3}
#view{position:absolute;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:5;display:flex;flex-direction:column}#view.on{transform:none}
#gl{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab;background:#000}#gl canvas{display:block;width:100%;height:100%}
.chipv{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0009;backdrop-filter:blur(10px);padding:6px 12px;border-radius:99px;font-size:12px;pointer-events:none;white-space:nowrap}
.rb{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:34px;height:34px;border-radius:50%;background:#0009;backdrop-filter:blur(10px);font-size:18px}
.nv{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;background:#0007;font-size:18px;margin-top:-18px}.nv.l{left:10px}.nv.r{right:10px}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:9px;background:#3a3a42;margin:-6px auto 14px}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h2{margin:0;font-size:22px;font-weight:600}.hd small{color:var(--mu);font-size:12px}
#mini{display:grid;grid-template-columns:repeat(12,5px);gap:2px;padding:6px;border-radius:8px;background:var(--s)}#mini i{width:5px;height:5px;border-radius:1.5px;background:#3b3b44}#mini i.x{background:#1d1d22}#mini i.me{background:var(--gr);box-shadow:0 0 6px var(--gr)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.st div{background:var(--s);border-radius:14px;padding:10px 12px}.st b{font-size:17px;font-weight:600;display:block}.st small{font-size:10px;color:var(--mu)}
.bt{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.bt button{padding:14px;border-radius:99px;font-weight:600;font-size:14px}.bt .a{background:var(--s2)}.bt .b{background:#fff;color:#000}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}#modal.on{display:flex}
#modal .sheet{width:100%;background:#131317}.sl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #26262c;font-size:14px}.sl span:first-child{color:var(--mu)}
.tk{text-align:center}.tk canvas{background:#fff;border-radius:12px;margin:12px auto;display:block}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:#26262c;padding:9px 15px;border-radius:99px;font-size:12px;opacity:0;transition:.3s;pointer-events:none;z-index:12;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%)}
</style></head><body>
<div id="app">
<header><span class="ghost"></span><div><b>SeatScope</b><small>Fri 14 Nov · Screen 1</small></div><button class="ghost" id="clr">Clear</button></header>
<div class="times" id="times"></div>
<div class="arc"><span>SCREEN</span></div>
<div id="rows"></div>
<div class="leg"><span><i style="background:#3b3b44"></i>Available</span><span><i style="background:#17171b"></i>Taken</span><span><i style="background:#fff"></i>Selected</span></div>
<div class="bar"><div><small id="sl">Select a seat to see your view</small><b id="sp">—</b></div><button class="go" id="go" disabled>Continue</button></div>

<div id="view">
<div id="gl"><button class="rb" id="back">‹</button><div class="chipv" id="chip"></div><button class="nv l" id="pv">‹</button><button class="nv r" id="nx">›</button></div>
<div class="sheet">
<div class="hd"><div><h2 id="vt"></h2><small id="vs"></small></div><div id="mini"></div></div>
<div class="st"><div><b id="d1"></b><small>Distance</small></div><div><b id="d2"></b><small>View angle</small></div><div><b id="d3"></b><small>Off-centre</small></div></div>
<div class="bt"><button class="a" id="chg">Change seat</button><button class="b" id="bk"></button></div>
</div></div>
<div id="modal"><div class="sheet" id="mb"></div></div><div class="toast" id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ROWS="ABCDEFGHI",NC=12,NR=9,TIMES=["17:30","18:45","22:15"],SW=14,SH=6,SCY=1.5+SH/2;
const S={t:1,sel:[],cur:null};
const P=r=>r<3?180:r<6?250:350,eur=v=>"₹"+v.toLocaleString("en-IN");
const sx=c=>(c-5.5)*.7+(c>=6?.45:-.45),sz=r=>4.5+r*1.15,ry=r=>.1+r*.3;
const key=(r,c)=>r+"-"+c,rc=k=>k.split("-").map(Number),nm=k=>{const[r,c]=rc(k);return ROWS[r]+(c+1)};
const BC={};
function booked(){const t=S.t;if(BC[t])return BC[t];let a=t*7919+13;const rnd=()=>{a=(a+0x6D2B79F5)>>>0;let z=a;z=Math.imul(z^z>>>15,z|1);z^=z+Math.imul(z^z>>>7,z|61);return((z^z>>>14)>>>0)/4294967296};const s=new Set();for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)if(rnd()<.16+r*.02)s.add(key(r,c));return BC[t]=s}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
const total=()=>S.sel.reduce((s,k)=>s+P(rc(k)[0]),0);

/* ---- seat map ---- */
function map(){const b=booked();
$("#times").innerHTML=TIMES.map((t,i)=>`<button class="pill ${i==S.t?"on":""}" data-i="${i}">${t}</button>`).join("");
$("#rows").innerHTML=[...Array(NR)].map((_,r)=>`<div class="row" style="width:${76+r*2.6}%"><b>${ROWS[r]}</b>`+[...Array(NC)].map((_,c)=>{const k=key(r,c),x=b.has(k);return`${c==6?"<i></i>":""}<button class="s ${x?"x":S.sel.includes(k)?"on":""}" data-k="${k}" aria-label="Seat ${ROWS[r]}${c+1}" ${x?"disabled":""}></button>`}).join("")+"</div>").join("");
const n=S.sel.length;$("#sl").textContent=n?"Seat"+(n>1?"s ":" ")+S.sel.map(nm).join(", "):"Select a seat to see your view";$("#sp").textContent=n?eur(total()):"—";$("#go").disabled=!n}
$("#times").onclick=e=>{const b=e.target.closest(".pill");if(!b)return;S.t=+b.dataset.i;S.sel=[];map()};
$("#rows").onclick=e=>{const b=e.target.closest(".s");if(b&&!b.disabled)openView(b.dataset.k)};
$("#clr").onclick=()=>{S.sel=[];map()};

/* ---- 3D ---- */
const gl=$("#gl"),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));gl.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x040405);
const cam=new THREE.PerspectiveCamera(68,.8,.05,80);cam.rotation.order="YXZ";
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:.05},o));
const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o},BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
scene.add(new THREE.AmbientLight(0xb8b0c8,.5));
const warm=new THREE.PointLight(0xffd0a0,1.2,34);warm.position.set(0,3.5,3.5);scene.add(warm);
const fl=M(0x16141a),wl=M(0x121116),red=M(0xa3182a,{emissive:0x2a0308}),redSel=M(0xe8394f,{emissive:0x5a0a14,emissiveIntensity:.8});
add(BX(20,.1,4.4),fl,0,.05,2.2);
for(let r=0;r<NR;r++){add(BX(20,ry(r),1.15),fl,0,ry(r)/2,sz(r));[-.95,.95,-6.4,6.4].forEach(x=>add(BX(.06,.02,1),new THREE.MeshBasicMaterial({color:0xffb86b}),x,ry(r)+.01,sz(r)-.05))}
add(BX(.5,10,19),wl,-10.2,5,8);add(BX(.5,10,19),wl,10.2,5,8);add(BX(21,10,.5),wl,0,5,-.3);add(BX(21,10,.5),wl,0,5,17.6);add(BX(21,.4,19),M(0x0b0a0d),0,10,8);
for(let i=0;i<6;i++)[-9.8,9.8].forEach(x=>add(BX(.12,.5,.3),new THREE.MeshBasicMaterial({color:0xffb25e}),x,2.8,1.5+i*2.7));
add(BX(SW+.5,SH+.5,.2),new THREE.MeshBasicMaterial({color:0}),0,SCY,-.05);
const cv=document.createElement("canvas");cv.width=1024;cv.height=440;
(function(){const x=cv.getContext("2d"),g=x.createLinearGradient(0,0,0,440);g.addColorStop(0,"#e9b98f");g.addColorStop(.55,"#f6dcc0");g.addColorStop(1,"#f2d2ae");x.fillStyle=g;x.fillRect(0,0,1024,440);
const rg=x.createRadialGradient(760,150,5,760,150,220);rg.addColorStop(0,"#fff6e0");rg.addColorStop(1,"#fff6e000");x.fillStyle=rg;x.fillRect(0,0,1024,440);
[["#d9a56c",250,40,.006,0],["#c58a52",300,55,.009,2],["#a86f3b",360,45,.012,4],["#8e5a2c",410,28,.016,1]].forEach(([c,b,a,f,p])=>{x.fillStyle=c;x.beginPath();x.moveTo(0,440);for(let i=0;i<=1024;i+=8)x.lineTo(i,b-a*Math.sin(i*f*2+p)-a*.4*Math.sin(i*f*5+p));x.lineTo(1024,440);x.fill()});
x.fillStyle="#2a1a10";x.fillRect(402,286,3,11)})();
const tex=new THREE.CanvasTexture(cv);add(new THREE.PlaneGeometry(SW,SH),new THREE.MeshBasicMaterial({map:tex}),0,SCY,.06);
const cg=BX(.56,.14,.52),bg=BX(.56,.64,.1),lg=BX(.1,.4,.1),hg=new THREE.SphereGeometry(.13,10,8),tg=BX(.4,.5,.2),seats={};
for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){const g=new THREE.Group();g.position.set(sx(c),ry(r),sz(r));const cu=new THREE.Mesh(cg,red),bk=new THREE.Mesh(bg,red),l=new THREE.Mesh(lg,wl),p=new THREE.Group();
cu.position.y=.42;bk.position.set(0,.8,.27);l.position.y=.2;const t=new THREE.Mesh(tg,M(0x2a2630)),h=new THREE.Mesh(hg,M(0x7a5b4a));t.position.set(0,.8,.08);h.position.set(0,1.2,.08);p.add(t,h);g.add(cu,bk,l,p);scene.add(g);seats[key(r,c)]={cu,bk,p}}
function paint(){const b=booked();for(const k in seats){const s=seats[k],m=k==S.cur?redSel:red;s.cu.material=s.bk.material=m;s.p.visible=b.has(k)}}
const aim=(p,t)=>{const d=t.clone().sub(p);return{y:Math.atan2(-d.x,-d.z),p:Math.atan2(d.y,Math.hypot(d.x,d.z))}};
let base={y:0,p:0},off={y:0,p:0},fovT=68,run=false,drag=null;
gl.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];gl.setPointerCapture(e.pointerId)});
gl.addEventListener("pointermove",e=>{if(!drag)return;off.y=Math.max(-1,Math.min(1,off.y+(e.clientX-drag[0])*.004));off.p=Math.max(-.5,Math.min(.5,off.p+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY]});
gl.addEventListener("pointerup",()=>drag=null);
gl.addEventListener("wheel",e=>{e.preventDefault();fovT=Math.max(35,Math.min(90,fovT+e.deltaY*.04))},{passive:false});
let W=0,H=0;
(function tick(){requestAnimationFrame(tick);if(!run)return;const w=gl.clientWidth,h=gl.clientHeight;if(!w||!h)return;if(w!=W||h!=H){W=w;H=h;R.setSize(w,h,false);cam.aspect=w/h}
cam.fov+=(fovT-cam.fov)*.1;cam.updateProjectionMatrix();cam.rotation.set(base.p+off.p,base.y+off.y,0);R.render(scene,cam)})();

/* ---- first-person view sheet ---- */
function openView(k){S.cur=k;const[r,c]=rc(k),p=new THREE.Vector3(sx(c),ry(r)+1.2,sz(r));cam.position.copy(p);const a=aim(p,new THREE.Vector3(0,SCY,0));base={y:a.y,p:a.p};off={y:0,p:0};cam.fov=88;fovT=68;paint();
const d=Math.hypot(sx(c),SCY-p.y,sz(r)),ang=(Math.atan2(SW/2-sx(c),sz(r))-Math.atan2(-SW/2-sx(c),sz(r)))*180/Math.PI,oc=Math.abs(Math.atan2(sx(c),sz(r)))*180/Math.PI,sel=S.sel.includes(k);
$("#vt").textContent=`Row ${ROWS[r]}, Seat ${c+1}`;$("#vs").textContent=`${r<3?"Front":r<6?"Standard":"Premium"} · ${eur(P(r))}`;$("#chip").textContent="● View from "+nm(k);
$("#d1").textContent=d.toFixed(1)+" m";$("#d2").textContent=ang.toFixed(0)+"°";$("#d3").textContent=oc.toFixed(0)+"°";
const b=booked();$("#mini").innerHTML=[...Array(NR*NC)].map((_,i)=>{const kk=key(i/NC|0,i%NC);return`<i class="${kk==k?"me":b.has(kk)?"x":""}"></i>`}).join("");
$("#bk").textContent=(sel?"Remove · ":"Book · ")+eur(P(r));run=true;$("#view").classList.add("on")}
function closeView(){$("#view").classList.remove("on");setTimeout(()=>{if(!$("#view").classList.contains("on"))run=false},520)}
$("#back").onclick=$("#chg").onclick=closeView;
$("#bk").onclick=()=>{const k=S.cur,i=S.sel.indexOf(k);if(i>=0)S.sel.splice(i,1);else{if(S.sel.length>=6)return toast("Max 6 seats");S.sel.push(k)}map();closeView();toast(i>=0?nm(k)+" removed":nm(k)+" added")};
function step(dir){const[r,c0]=rc(S.cur),b=booked();for(let c=c0+dir;c>=0&&c<NC;c+=dir)if(!b.has(key(r,c)))return openView(key(r,c));toast("No more free seats this way")}
$("#pv").onclick=()=>step(-1);$("#nx").onclick=()=>step(1);

/* ---- checkout ---- */
$("#go").onclick=()=>{const n=S.sel.length,sub=total(),fee=n*30;
$("#mb").innerHTML=`<div class="hd"><h2>Checkout</h2><button class="ghost" id="mx">Close</button></div><div style="margin:10px 0 16px"><div class="sl"><span>Showing</span><b>${TIMES[S.t]} · Screen 1</b></div><div class="sl"><span>Seats</span><b>${S.sel.map(nm).join(", ")}</b></div><div class="sl"><span>Tickets</span><b>${eur(sub)}</b></div><div class="sl"><span>Booking fee</span><b>${eur(fee)}</b></div><div class="sl"><span>Total</span><b>${eur(sub+fee)}</b></div></div><button class="go" id="pay" style="width:100%">Pay ${eur(sub+fee)}</button><p style="text-align:center;font-size:11px;color:var(--mu);margin:10px 0 0">Demo only · no real payment</p>`;
$("#modal").classList.add("on");$("#mx").onclick=()=>$("#modal").classList.remove("on");
$("#pay").onclick=()=>{$("#pay").textContent="Processing…";$("#pay").disabled=true;setTimeout(()=>{const id="SS"+Math.random().toString(36).slice(2,8).toUpperCase();
$("#mb").innerHTML=`<div class="tk"><h2 style="margin:0">You’re in 🎟️</h2><small style="color:var(--mu)">Booking ${id} · ${S.sel.map(nm).join(", ")} · ${TIMES[S.t]}</small><canvas id="qr" width="132" height="132"></canvas><button class="go" id="dn" style="width:100%">Done</button></div>`;
const q=$("#qr").getContext("2d");let a=[...id].reduce((h,ch)=>h*31+ch.charCodeAt(0),5);for(let y=0;y<22;y++)for(let x=0;x<22;x++){a=(a*1103515245+12345)>>>0;if((a>>>16)&1)q.fillRect(x*6,y*6,6,6)}
$("#dn").onclick=()=>{booked();BC[S.t]=new Set([...BC[S.t],...S.sel]);S.sel=[];$("#modal").classList.remove("on");map()}},1100)}};
map();
</script></body></html>
